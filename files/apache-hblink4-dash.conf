# HBlink4 dashboard reverse proxy.
# TLS terminates here on 443. Uvicorn stays on 127.0.0.1:8080 (host network).
# __FQDN__ is filled in by hblink4-ssl.
#
#   Copyright (C) 2026 Shane Daley, M0VUB aka ShaYmez. <shane@freestar.network>

<VirtualHost *:80>
	ServerName __FQDN__
	RewriteEngine On
	RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
	ServerName __FQDN__
	SSLEngine on
	SSLCertificateFile /etc/letsencrypt/live/__FQDN__/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/__FQDN__/privkey.pem
	Include /etc/letsencrypt/options-ssl-apache.conf

	ProxyRequests Off
	ProxyPreserveHost On
	RequestHeader set X-Forwarded-Proto "https"
	RequestHeader set X-Forwarded-Port "443"

	# FastAPI WebSocket is same-origin /ws — must be listed before the HTTP catch-all.
	ProxyPass /ws ws://127.0.0.1:8080/ws retry=0 timeout=3600
	ProxyPassReverse /ws ws://127.0.0.1:8080/ws

	ProxyPass / http://127.0.0.1:8080/ retry=0
	ProxyPassReverse / http://127.0.0.1:8080/
</VirtualHost>
</IfModule>
